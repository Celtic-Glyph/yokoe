                <button type="button" onclick="generateInviteFromID()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg shrink-0 font-medium transition">Generate</button>

            <div class="sm:col-span-2">

          <div>
            <label class="text-[11px] text-slate-400 mb-1 block">Short Description</label>

            <h4 class="text-xs font-semibold text-slate-300">Extended Bot Info Page Details</h4>

              <label class="text-[11px] text-slate-400 mb-1 block">Commands (One command per line)</label>

            </div>
            <div>
              <label class="text-[11px] text-slate-400 mb-1 block">Usage Guide</label>
              <textarea id="bot-usage" placeholder="How to use the bot..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm h-16 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
            </div>
            <div>
              <label class="text-[11px] text-slate-400 mb-1 block">Configuration Instructions</label>
              <textarea id="bot-config" placeholder="Setup or permissions needed..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm h-16 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
            </div>

          <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-lg text-sm font-semibold transition shadow-lg shadow-emerald-600/20">Add Bot</button>
        </form>

        <div class="space-y-3">
          <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Manage Existing Bots</h3>
          <div id="admin-bot-list" class="space-y-2"></div>

    </div>

  <script>
    const ADMIN_PIN = "1234";
    let bots = [];
    let selectedCategory = "All";
    let selectedStatus = "All";
    let currentUser = JSON.parse(localStorage.getItem('yokoe_user') || 'null');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'upvote') {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'success') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    // --- Discord OAuth Popup & Session Handling ---
    function loginWithDiscord() {
      const width = 500, height = 750;
      const left = (window.innerWidth / 2) - (width / 2);
      const top = (window.innerHeight / 2) - (height / 2);
      window.open('/api/auth/discord', 'DiscordAuth', `width=${width},height=${height},top=${top},left=${left}`);
    }

    function logoutDiscord() {
      currentUser = null;
      localStorage.removeItem('yokoe_user');
      updateAuthUI();
      renderGallery();
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'DISCORD_AUTH_SUCCESS') {
        currentUser = event.data.user;
        localStorage.setItem('yokoe_user', JSON.stringify(currentUser));
        updateAuthUI();
        playSound('success');
      }
    });

    function updateAuthUI() {
      const authContainer = document.getElementById('auth-container');
      const adminNavBtn = document.getElementById('admin-nav-btn');

      if (currentUser) {
        authContainer.innerHTML = `
          <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 p-1.5 pr-3 rounded-xl">
            <img src="${currentUser.avatar}" class="w-6 h-6 rounded-full border border-indigo-500">
            <span class="text-xs text-slate-200 font-bold">${currentUser.username}</span>
            <button onclick="logoutDiscord()" class="text-[10px] text-slate-400 hover:text-rose-400 ml-1">✕</button>
          </div>
        `;
        if (currentUser.isAdmin) {
          adminNavBtn.classList.remove('hidden');
        } else {
          adminNavBtn.classList.add('hidden');
        }
      } else {
        authContainer.innerHTML = `
          <button onclick="loginWithDiscord()" class="bg-[#5865F2] hover:bg-[#4752C4] text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-lg shadow-[#5865F2]/20 active:scale-95">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 127.14 96.36">

    async function loadBotsFromAPI() {
      try {
        const res = await fetch('/api/bots');
        bots = await res.json();
        bots = bots.map(b => ({ ...b, id: b._id || b.id }));
        renderGallery();
        renderAdminList();
      } catch (err) {
        console.error('Failed to load bots from backend API', err);
      }
    }

    function processAndResizeImage(file, maxWidth = 600, maxHeight = 400) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/png', 0.85));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    function getAverageRating(bot) {
      if (!bot.reviews || bot.reviews.length === 0) return 0;
      const total = bot.reviews.reduce((sum, r) => sum + r.rating, 0);
      return (total / bot.reviews.length).toFixed(1);
    }

    async function upvoteBot(e, botId) {
      e.stopPropagation();
      if (!currentUser) {
        alert("You must log in with Discord to upvote!");
        loginWithDiscord();
        return;
      }

      playSound('upvote');
      try {
        const res = await fetch(`/api/bots/${botId}/upvote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ discordId: currentUser.id })
        });
        const data = await res.json();
        if (res.ok) {
          await loadBotsFromAPI();
          const detailContainer = document.getElementById('view-details');
          if (!detailContainer.classList.contains('hidden')) showBotDetailView(botId);
        } else {
          alert(data.error || 'Upvote failed.');
        }
      } catch (err) {
        console.error('Upvote failed', err);
      }
    }

    async function addReview(e, botId) {
      e.preventDefault();
      if (!currentUser) {
        alert("You must log in with Discord to leave a review!");
        loginWithDiscord();
        return;
      }

      const rating = parseInt(document.getElementById('review-rating').value, 10);
      const text = document.getElementById('review-text').value.trim();
      if (!text) return;

      try {
        const res = await fetch(`/api/bots/${botId}/reviews`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            author: currentUser.username,
            discordId: currentUser.id,
            avatar: currentUser.avatar,
            rating, text
          })
        });

        if (res.ok) {
          playSound('success');
          await loadBotsFromAPI();
          showBotDetailView(botId);
        } else {
          const errData = await res.json();
          alert(errData.error || 'Failed to submit review');
        }
      } catch (err) {
        console.error('Review failed', err);
      }
    }

      playSound('click');

    function copyCommand(btn, cmdText) {
      playSound('click');
      navigator.clipboard.writeText(cmdText);
      const originalText = btn.innerHTML;
      btn.innerHTML = `✓ Copied!`;
      btn.classList.add('bg-emerald-600/20', 'text-emerald-400', 'border-emerald-500/40');
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.remove('bg-emerald-600/20', 'text-emerald-400', 'border-emerald-500/40');
      }, 1500);

    function renderGallery() {
      const grid = document.getElementById('bot-grid');
      const searchQuery = document.getElementById('search-input')?.value.toLowerCase() || '';
      const sortVal = document.getElementById('sort-select')?.value || 'popular';

      let filteredBots = bots.filter(bot => {
        const matchesCategory = selectedCategory === 'All' || bot.category === selectedCategory;
        const matchesStatus = selectedStatus === 'All' || bot.status === selectedStatus;
        const matchesSearch = bot.name.toLowerCase().includes(searchQuery) || bot.description.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesStatus && matchesSearch;
      });

      filteredBots.sort((a, b) => {
        if (sortVal === 'popular') return (b.votes || 0) - (a.votes || 0);
        if (sortVal === 'rating') return getAverageRating(b) - getAverageRating(a);
        if (sortVal === 'name') return a.name.localeCompare(b.name);
        return 0;
      });

      if (filteredBots.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500"><p class="text-base font-semibold">No bots found matching your filters.</p></div>`;

      document.getElementById('bot-avatar-file').required = true;
      document.getElementById('form-title').innerText = "Add New Bot";
      document.getElementById('submit-btn').innerText = "Add Bot";
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      document.getElementById('current-avatar-notice').classList.add('hidden');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const editingId = document.getElementById('editing-bot-id').value.trim();
      const avatarFile = document.getElementById('bot-avatar-file').files[0];
      const bannerFile = document.getElementById('bot-banner-file').files[0];

      let avatarBase64 = null, bannerBase64 = null;
      if (avatarFile) avatarBase64 = await processAndResizeImage(avatarFile, 256, 256);
      if (bannerFile) bannerBase64 = await processAndResizeImage(bannerFile, 800, 300);

      const existingBot = editingId ? bots.find(b => b.id === editingId) : null;
      if (!editingId && !avatarBase64) return alert("Please upload an Avatar Image.");

      const payload = {
        name: document.getElementById('bot-name').value.trim(),
        category: document.getElementById('bot-category').value,
        featured: document.getElementById('bot-featured').checked,
        verified: document.getElementById('bot-verified').checked,
        invite: document.getElementById('bot-invite').value.trim(),
        servers: document.getElementById('bot-servers').value.trim() || '1.0k+',
        ping: document.getElementById('bot-ping').value.trim() || '20ms',
        status: document.getElementById('bot-status').value,
        description: document.getElementById('bot-desc').value.trim(),
        commands: document.getElementById('bot-commands').value.trim(),
        usage: document.getElementById('bot-usage').value.trim(),
        config: document.getElementById('bot-config').value.trim(),
        avatar: avatarBase64 || (existingBot ? existingBot.avatar : ''),
        banner: bannerBase64 || (existingBot ? existingBot.banner : '')
      };

      if (editingId) payload.id = editingId;

      try {
        const res = await fetch('/api/bots/manage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          playSound('success');
          await loadBotsFromAPI();
          resetForm();
          closeAdminModal();
        } else {
          const errData = await res.json();
          alert(`Error: ${errData.error || 'Save failed'}`);
        }
      } catch (err) {
        console.error('Failed to save bot:', err);
      }
    }

    async function deleteBot(id) {
      if (confirm('Are you sure you want to delete this bot?')) {
        try {
          const res = await fetch(`/api/bots/${id}`, { method: 'DELETE' });
          if (res.ok) {
            await loadBotsFromAPI();
            showGalleryView();
          }
        } catch (err) {
          console.error('Delete failed', err);
        }
      }
    }

    function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
    function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

    function authenticateAdmin() {
      const pin = document.getElementById('admin-pin').value;
      if (pin === ADMIN_PIN || (currentUser && currentUser.isAdmin)) {
        playSound('success');
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('admin-controls').classList.remove('hidden');
        renderAdminList();
      } else {
        alert('Incorrect PIN');
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        openAdminModal();
      }
    });

    // --- Snow Background Animation ---
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let flakes = [];

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function createSnowflakes() {
      flakes = [];
      const count = Math.floor(window.innerWidth / 12);
      for (let i = 0; i < count; i++) {
        flakes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 0.5,
          speed: Math.random() * 0.8 + 0.3,
          wind: Math.random() * 0.5 - 0.25,
          opacity: Math.random() * 0.5 + 0.2
        });
      }
    }

    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      flakes.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${f.opacity})`;
        ctx.fill();

        f.y += f.speed;
        f.x += f.wind;

        if (f.y > canvas.height) { f.y = -5; f.x = Math.random() * canvas.width; }
        if (f.x > canvas.width) f.x = 0;
        if (f.x < 0) f.x = canvas.width;
      });
      requestAnimationFrame(drawSnow);
    }

    window.addEventListener('resize', () => { resizeCanvas(); createSnowflakes(); });
    resizeCanvas(); createSnowflakes(); drawSnow();

    // Init
    updateAuthUI();
    loadBotsFromAPI();
  </script>
</body>
</html>
